services:
  db:
    image: postgres:17.11
    container_name: re-taskflow-db
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_DB: re-taskflow
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - re-taskflow-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d re-taskflow"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    
volumes:
  re-taskflow-volume: